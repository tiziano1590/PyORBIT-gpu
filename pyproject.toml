[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyorbit-package"
version = "12.0.0b0"
description = "PyORBIT: a code for exoplanet orbital parameters and stellar activity"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Luca Malavolta", email = "luca.malavolta@unipd.it" },
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "numpy>=1.24.3,<2.0",
    "numba>=0.55.2",
    "scipy>=1.8.1,<1.16",
    "matplotlib>=3.5.2,<3.11",
    "astropy>=5.1",
    "astroquery>=0.4",
    "pyerfa>=2.0",
    "emcee>=3.1.2",
    "pyyaml",
    "h5py",
    "tqdm",
    "pygtc",
    "jaxlib>=0.4.31,<=0.6.2",
    "jax>=0.4.31,<=0.6.2",
    "tinygp==0.3.0",
    "ordered-set",
    "packaging",
]

[project.optional-dependencies]
# GPU enablement (Round 1): the CUDA-capable JAX stack plus the JAX-native model
# kernels. `pip install pyorbit-package[gpu]` pulls a jax/jaxlib CUDA build that
# can actually drive the GPU (the CPU-only 0.4.31 build cannot), plus jaxoplanet
# (transit), splEaF (activity GPs), cuPy and batman-package (CPU transit
# reference). The base `dependencies` keep wide bounds so the CPU-only install
# still resolves to a working jax.
gpu = [
    "jax[cuda12]==0.6.2",
    "ml-dtypes<0.6",
    "cupy-cuda12x>=13,<14",
    "jaxoplanet==0.1.0",
    "spleaf==2.1.20",
    "batman-package==2.5.3",
]

[project.urls]
Homepage = "https://github.com/LucaMalavolta/PyORBIT"

[project.scripts]
pyorbit_run = "pyorbit.pyorbit_run:pyorbit_run"
pyorbit_results = "pyorbit.pyorbit_results:pyorbit_results"

[tool.setuptools]
packages = [
    "pyorbit",
    "pyorbit.common",
    "pyorbit.classes",
    "pyorbit.models",
    "pyorbit.samplers",
    "pyorbit.subroutines",
]
zip-safe = false
